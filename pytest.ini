[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: slow end-to-end stress tests (network, optional)
    telegram_e2e: optional Telethon live E2E (requires TELEGRAM_E2E=1 + secrets)
# Live progress: tests/conftest.py prints [n/total % | ok/fail | eta]
# Preferred entry: ./scripts/run_unit_tests.sh  (local mongo only)
addopts = -ra --tb=line --strict-markers
