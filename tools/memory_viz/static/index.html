<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xagent Memory Cortex</title>
  <link rel="stylesheet" href="/css/cortex.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="hud-compact">
  <div id="boot-bg"></div>
  <canvas id="cortex-canvas" aria-label="3D memory cortex"></canvas>
  <canvas id="graph-canvas" aria-label="3D knowledge graph" style="display:none"></canvas>
  <div id="hover-tip" class="hover-tip" hidden></div>

  <header id="hud-top" class="glass compact" data-mode="compact">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div class="brand-text">
          <h1>Memory <span id="ws-dot" class="ws-dot" title="WebSocket"></span></h1>
          <p id="status-line" class="muted">booting…</p>
        </div>
      </div>
      <div class="brand-actions">
        <div id="mode-toggle" class="mode-toggle" role="group" aria-label="Visualization mode">
          <button type="button" id="mode-cortex" class="mode-btn on" data-mode="cortex" title="Cortex — embedding space">Cortex</button>
          <button type="button" id="mode-graph" class="mode-btn" data-mode="graph" title="Graph — synapses &amp; relations">Graph</button>
        </div>
        <button id="hud-expand" type="button" class="ghost icon-btn" title="Expand settings" aria-expanded="false">☰</button>
      </div>
    </div>

    <div id="hud-compact-bar" class="compact-bar">
      <input
        id="query-input-compact"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Query…"
        aria-label="Query input compact"
      />
      <button id="query-btn-compact" type="button" title="Run query">⌕</button>
      <div id="zoom-controls" class="zoom-controls" aria-label="Zoom">
        <button id="zoom-out" type="button" class="zoom-btn" title="Zoom out">−</button>
        <input id="zoom-slider" type="range" min="0" max="100" value="45" title="Zoom" aria-label="Zoom slider" />
        <button id="zoom-in" type="button" class="zoom-btn" title="Zoom in">+</button>
      </div>
    </div>
    <p id="graph-stats" class="graph-stats muted" hidden></p>

    <div id="hud-expanded" class="hud-expanded" hidden>
      <div id="query-row">
        <input
          id="query-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Query the memory… e.g. ARIA volume"
          aria-label="Query input"
        />
        <button id="query-btn" type="button" title="Run query">⌕</button>
        <select id="top-k" aria-label="Top K">
          <option value="20">top 20</option>
          <option value="40" selected>top 40</option>
          <option value="60">top 60</option>
        </select>
        <button id="reset-view" type="button" class="ghost" title="Reset camera">reset</button>
        <button id="clear-hits" type="button" class="ghost" title="Clear hits">clear</button>
      </div>
      <div id="symbol-chips" class="chips" aria-label="Symbol filters"></div>
      <div id="lobe-toggles" class="chips lobes" aria-label="Lobe toggles"></div>
    </div>
  </header>

  <aside id="detail-drawer" class="glass drawer" hidden aria-live="polite">
    <div class="drawer-head">
      <h2>Node detail</h2>
      <button id="drawer-close" type="button" class="ghost" aria-label="Close drawer">✕</button>
    </div>
    <div id="drawer-meta" class="meta-grid"></div>
    <p id="drawer-title" class="drawer-title"></p>
    <pre id="drawer-body" class="drawer-body"></pre>
    <button id="copy-id" type="button" class="ghost">copy id</button>
  </aside>

  <footer id="hit-strip" class="glass" aria-label="Query hit strip">
    <span class="hit-label">HITS</span>
    <div id="hit-list" class="hit-list"><span class="muted">No query yet — try ARIA volume</span></div>
  </footer>

  <div id="legend" class="glass" aria-label="Lobe legend"></div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
