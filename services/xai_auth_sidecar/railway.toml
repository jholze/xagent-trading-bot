# Railway config for the `xagent-xai-auth` service (#397).
# Service root directory = repository root; set this file as the service's
# config-as-code path so the build uses the dedicated Node 22 Dockerfile below
# instead of the shared Python root Dockerfile (same idea as
# services/santiment/sidecar/railway.toml).
# Attach a Volume mounted at /data/grok — the OAuth session lives there.
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/xai_auth_sidecar/Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
