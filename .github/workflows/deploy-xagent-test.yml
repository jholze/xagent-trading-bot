name: Deploy xagent-test

on:
  push:
    branches:
      - feature/entry-guard-15m

concurrency:
  group: xagent-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway test (${{ github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/railway_trigger_test_deploy.sh

      - name: Wait for health
        env:
          HEALTH_URL: https://xagent-test-test.up.railway.app/health
          HEALTH_DETAIL_URL: https://xagent-test-test.up.railway.app/health/detail
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${EXPECT_COMMIT:0:7}"
          for i in $(seq 1 36); do
            if curl -sf -m 15 "${HEALTH_URL}" >/dev/null 2>&1; then
              DETAIL="$(curl -sf -m 15 "${HEALTH_DETAIL_URL}" || echo '{}')"
              LIVE="$(echo "$DETAIL" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('build',{}).get('commit',''))" 2>/dev/null || true)"
              if [[ "$LIVE" == "$SHORT" ]]; then
                echo "Live commit matches: ${SHORT}"
                exit 0
              fi
              echo "Health OK, commit=${LIVE:-?} (want ${SHORT}) — retry ${i}/36"
            else
              echo "Health pending — retry ${i}/36"
            fi
            sleep 15
          done
          echo "WARN: timed out waiting for commit ${SHORT} on test instance"
          exit 1